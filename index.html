<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfer Fee Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading-overlay">Loading Database...</div>
  <div id="game-view" class="game-view">
  <div id="auth-container" class="auth-container">
      <button id="login-btn" class="btn-auth">
        <!-- Google "G" SVG Logo -->
        <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
        </svg>
        <span>Sign In</span>
      </button>  

      <div id="user-info" class="user-profile" style="display: none;">
        <img id="user-avatar" src="" alt="Profile Picture" class="profile-pic">
        <span id="user-name" class="profile-name"></span>
        <button id="logout-btn" class="btn btn-logout">Sign Out</button>
      </div>
    </div>

  <header class="game-header">
    <div class="header-titles">
      <h1 class="main-title">Transfer Fee Game</h1>
      <p class="sub-title">Prototype UI</p>
    </div>
    
    <div class="score-container">
      <span class="score-label">Streak</span>
      <span id="uiScore" class="score-value">0</span>
    </div>
  </header>

  <main class="arena-viewport">
    <div id="arenaBelt" class="arena-belt">
      
      <!-- card 1 -->
      <div class="player-card" id="card1">
        <div id="p1Year" class="card-year">2017</div>
        <div class="player-info">
          <h2 id="p1Name" class="player-name">Neymar Jr</h2>
          <p id="p1Teams" class="player-teams">Barcelona to PSG</p>
        </div>
        <div class="price-section">
          <span class="price-label">Market Fee</span>
          <div id="p1Price" class="price-value p1-color">€222,000,000</div>
        </div>
      </div>

      <!-- card 2 -->
      <div class="player-card" id="card2">
        <div id="p2Year" class="card-year">2018</div>
        <div class="player-info">
          <h2 id="p2Name" class="player-name">Kylian Mbappé</h2>
          <p id="p2Teams" class="player-teams">Monaco to PSG</p>
        </div>
        <div class="price-section">
          <div class="interactive-container">
            <div id="uiControls" class="btn-group">
              <button onclick="guess('higher')" class="btn btn-higher">Higher</button>
              <button onclick="guess('lower')" class="btn btn-lower">Lower</button>
            </div>
            <div id="p2Fee" class="reveal-value hidden">€180,000,000</div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="game-footer">
    FOOTER (clickable links will go here)
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDUGd8600ne8Y9rlcSrb6wiD3Ao-G7MS0g",
      authDomain: "nsfe-162c7.firebaseapp.com",
      projectId: "nsfe-162c7",
      storageBucket: "nsfe-162c7.firebasestorage.app",
      messagingSenderId: "547027866549",
      appId: "1:547027866549:web:eb5d1c5ffdda98f8a2bffc"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    window.auth = auth;
    window.db = db;
    window.provider = provider;
    window.signInWithPopup = signInWithPopup;
    window.signOut = signOut;
    window.onAuthStateChanged = onAuthStateChanged;

    window.firestoreDoc = doc;
    window.firestoreSetDoc = setDoc;
    window.firestoreGetDoc = getDoc;
  </script>

  <script src="script.js" defer></script>

</div>
</body>
</html>
